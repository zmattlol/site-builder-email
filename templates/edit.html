{% extends "base.html" %}
{% block title %}Edit — {{ email.business_name }} — Outreach Bot{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Email</h1>
    <p>Tweak the subject or body before sending</p>
</div>

<div class="card">
    <form method="POST">
        <div class="form-group">
            <label for="subject">Subject Line</label>
            <input type="text" id="subject" name="subject" value="{{ email.subject }}">
        </div>

        <div class="form-group">
            <label for="body">Email Body</label>
            <textarea id="body" name="body" style="min-height:400px; font-size:14px; line-height:1.7;">{{ email.body }}</textarea>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('preview', email_id=email.id) }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
